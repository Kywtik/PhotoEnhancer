name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write project files
        run: |
          mkdir -p proj/app/src/main/java/com/example/photoenhancer
          cat > proj/settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PhotoEnhancer"
          include(":app")
          EOF
          cat > proj/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > proj/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          cat > proj/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.photoenhancer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.photoenhancer"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:label="Photo Enhancer"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".EnhancerService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/java/com/example/photoenhancer/MainActivity.kt << 'EOF'
          package com.example.photoenhancer

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var keyField: EditText
              private lateinit var modelField: EditText
              private lateinit var toggle: Button
              private lateinit var status: TextView
              private lateinit var logView: TextView
              private var asked = false

              private fun mediaPerm(): String {
                  return if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.READ_MEDIA_IMAGES
                  } else {
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  }
              }

              private fun needed(): List<String> {
                  val l = ArrayList<String>()
                  l.add(mediaPerm())
                  if (Build.VERSION.SDK_INT >= 33) {
                      l.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  return l
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  val title = TextView(this)
                  title.text = "Автоулучшение фото"
                  title.textSize = 22f
                  root.addView(title)

                  keyField = EditText(this)
                  keyField.hint = "API-ключ Polza (pza_...)"
                  keyField.setText(cfg.getString("key", ""))
                  keyField.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  keyField.setSingleLine()
                  root.addView(keyField)

                  modelField = EditText(this)
                  modelField.hint = "ID модели"
                  modelField.setText(cfg.getString("model", EnhancerService.DEFAULT_MODEL))
                  modelField.setSingleLine()
                  root.addView(modelField)

                  val saveBtn = Button(this)
                  saveBtn.text = "Сохранить настройки"
                  saveBtn.setOnClickListener {
                      saveCfg()
                      Toast.makeText(this, "Сохранено", Toast.LENGTH_SHORT).show()
                  }
                  root.addView(saveBtn)

                  toggle = Button(this)
                  toggle.setOnClickListener {
                      if (EnhancerService.running) {
                          stopService(Intent(this, EnhancerService::class.java))
                          refreshSoon()
                      } else {
                          startEnhancer()
                      }
                  }
                  root.addView(toggle)

                  val battery = Button(this)
                  battery.text = "Настройки батареи приложения"
                  battery.setOnClickListener {
                      startActivity(
                          Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                              Uri.parse("package:" + packageName)
                          )
                      )
                  }
                  root.addView(battery)

                  status = TextView(this)
                  status.textSize = 16f
                  status.setPadding(0, pad, 0, pad / 2)
                  root.addView(status)

                  logView = TextView(this)
                  logView.textSize = 12f
                  logView.typeface = Typeface.MONOSPACE
                  logView.setTextIsSelectable(true)
                  root.addView(logView)

                  val scroll = ScrollView(this)
                  scroll.fitsSystemWindows = true
                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun saveCfg() {
                  getSharedPreferences("cfg", MODE_PRIVATE).edit()
                      .putString("key", keyField.text.toString().trim())
                      .putString("model", modelField.text.toString().trim())
                      .apply()
              }

              private fun toast(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
              }

              private fun startEnhancer() {
                  saveCfg()
                  if (keyField.text.toString().isBlank()) {
                      toast("Сначала введи API-ключ и нажми «Сохранить настройки»")
                      return
                  }
                  val missing = needed().filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty() && !asked) {
                      asked = true
                      requestPermissions(missing.toTypedArray(), 1)
                      return
                  }
                  if (checkSelfPermission(mediaPerm()) != PackageManager.PERMISSION_GRANTED) {
                      toast("Нужен доступ ко всем фото. Разреши его в настройках приложения.")
                      return
                  }
                  startForegroundService(Intent(this, EnhancerService::class.java))
                  refreshSoon()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  startEnhancer()
              }

              private fun refresh() {
                  val on = EnhancerService.running
                  toggle.text = if (on) "Выключить автоулучшение" else "Включить автоулучшение"
                  status.text = if (on) "Работает: слежу за папкой DCIM/Camera" else "Выключено"
              }

              private fun refreshSoon() {
                  toggle.postDelayed({ refresh() }, 700)
              }

              override fun onResume() {
                  super.onResume()
                  AppLog.listener = {
                      runOnUiThread { logView.text = AppLog.text() }
                  }
                  logView.text = AppLog.text()
                  refresh()
              }

              override fun onPause() {
                  super.onPause()
                  AppLog.listener = null
              }
          }
          EOF
          cat > proj/app/src/main/java/com/example/photoenhancer/EnhancerService.kt << 'EOF'
          package com.example.photoenhancer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.database.ContentObserver
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.net.Uri
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.MediaStore
          import android.util.Base64
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit
          import org.json.JSONArray
          import org.json.JSONObject

          object AppLog {
              private val lines = ArrayList<String>()
              @Volatile
              var listener: (() -> Unit)? = null
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.getDefault())

              @Synchronized
              fun add(msg: String) {
                  lines.add(fmt.format(Date()) + "  " + msg)
                  while (lines.size > 200) {
                      lines.removeAt(0)
                  }
                  listener?.invoke()
              }

              @Synchronized
              fun text(): String {
                  return lines.joinToString("\n")
              }
          }

          class HttpException(val code: Int, msg: String) : Exception(msg)

          class EnhancerService : Service() {

              companion object {
                  @Volatile
                  var running = false
                  const val DEFAULT_MODEL = "google/gemini-nano-banana-2.1"
                  const val API = "https://polza.ai/api/v1"
                  const val PROMPT = "Enhance this photo: improve sharpness, fine detail, lighting " +
                      "and color, reduce noise. Keep the composition, objects, faces " +
                      "and any text exactly the same."
                  val IMG: Uri = MediaStore.Images.Media.EXTERNAL_CONTENT_URI
              }

              private var exec: ScheduledExecutorService? = null
              private var startId = 0L
              private val done = HashSet<Long>()
              private var warnedNoKey = false

              private val observer = object : ContentObserver(Handler(Looper.getMainLooper())) {
                  override fun onChange(selfChange: Boolean) {
                      try {
                          exec?.execute { scan() }
                      } catch (e: Exception) {
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startIdArg: Int): Int {
                  if (running) return START_NOT_STICKY
                  startForeground(1, buildNotification(), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  running = true
                  startId = currentMaxId()
                  exec = Executors.newSingleThreadScheduledExecutor()
                  contentResolver.registerContentObserver(IMG, true, observer)
                  exec?.scheduleWithFixedDelay({ scan() }, 5, 5, TimeUnit.SECONDS)
                  AppLog.add("Служба запущена. Слежу за DCIM/Camera")
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  running = false
                  try {
                      contentResolver.unregisterContentObserver(observer)
                  } catch (e: Exception) {
                  }
                  exec?.shutdownNow()
                  AppLog.add("Служба остановлена")
                  super.onDestroy()
              }

              private fun buildNotification(): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("enh", "Автоулучшение", NotificationManager.IMPORTANCE_LOW)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, "enh")
                      .setContentTitle("Автоулучшение фото включено")
                      .setContentText("Слежу за папкой камеры")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              private fun cfg() = getSharedPreferences("cfg", MODE_PRIVATE)

              private fun currentMaxId(): Long {
                  contentResolver.query(
                      IMG,
                      arrayOf(MediaStore.Images.Media._ID),
                      MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?",
                      arrayOf("DCIM/Camera%"),
                      MediaStore.Images.Media._ID + " DESC"
                  )?.use { c ->
                      if (c.moveToFirst()) return c.getLong(0)
                  }
                  return 0L
              }

              private fun scan() {
                  try {
                      val key = cfg().getString("key", "") ?: ""
                      if (key.isBlank()) {
                          if (!warnedNoKey) {
                              warnedNoKey = true
                              AppLog.add("Не задан API-ключ")
                          }
                          return
                      }
                      val items = ArrayList<Pair<Long, String>>()
                      contentResolver.query(
                          IMG,
                          arrayOf(MediaStore.Images.Media._ID, MediaStore.Images.Media.DISPLAY_NAME),
                          MediaStore.Images.Media._ID + " > ? AND " +
                              MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?",
                          arrayOf(startId.toString(), "DCIM/Camera%"),
                          MediaStore.Images.Media._ID + " ASC"
                      )?.use { c ->
                          while (c.moveToNext()) {
                              items.add(Pair(c.getLong(0), c.getString(1) ?: "photo.jpg"))
                          }
                      }
                      for (item in items) {
                          if (!done.add(item.first)) continue
                          val lower = item.second.lowercase()
                          if (!lower.endsWith(".jpg") && !lower.endsWith(".jpeg")) continue
                          process(item.first, item.second)
                      }
                  } catch (e: Exception) {
                      AppLog.add("Ошибка проверки: " + e.message)
                  }
              }

              private fun process(id: Long, name: String) {
                  val uri = ContentUris.withAppendedId(IMG, id)
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "enhancer:work")
                  wl.acquire(10 * 60 * 1000L)
                  try {
                      Thread.sleep(1500)
                      AppLog.add("Новое фото: " + name)
                      var attempt = 0
                      while (true) {
                          attempt++
                          try {
                              val bytes = enhance(uri)
                              save(name, bytes)
                              AppLog.add("Готово: " + name)
                              return
                          } catch (e: HttpException) {
                              AppLog.add("Ошибка " + e.code + " (" + name + "): " + e.message)
                              val retry = e.code == 408 || e.code == 429 || e.code >= 500
                              if (!retry || attempt >= 3) return
                          } catch (e: InterruptedException) {
                              return
                          } catch (e: Exception) {
                              AppLog.add("Сбой (" + name + "): " + e.message)
                              if (attempt >= 3) return
                          }
                          Thread.sleep(5000)
                      }
                  } catch (e: InterruptedException) {
                      // служба остановлена
                  } finally {
                      if (wl.isHeld) wl.release()
                  }
              }

              private fun enhance(uri: Uri): ByteArray {
                  val c = cfg()
                  val key = (c.getString("key", "") ?: "").trim()
                  var model = (c.getString("model", DEFAULT_MODEL) ?: "").trim()
                  if (model.isEmpty()) model = DEFAULT_MODEL

                  val b64 = Base64.encodeToString(loadScaled(uri, 1536), Base64.NO_WRAP)
                  val input = JSONObject()
                      .put("prompt", PROMPT)
                      .put("output_format", "jpeg")
                      .put(
                          "images",
                          JSONArray().put(
                              JSONObject()
                                  .put("type", "base64")
                                  .put("data", "data:image/jpeg;base64," + b64)
                          )
                      )
                  val body = JSONObject().put("model", model).put("input", input).toString()

                  var res = http("POST", API + "/media", key, body)
                  var n = 0
                  while (res.optString("status") != "completed") {
                      val st = res.optString("status")
                      if (st == "failed" || st == "cancelled") {
                          throw RuntimeException("генерация не удалась: " + res.optString("error"))
                      }
                      n++
                      if (n > 150) throw RuntimeException("слишком долго")
                      Thread.sleep(2000)
                      res = http("GET", API + "/media/" + res.getString("id"), key, null)
                  }

                  var d: Any? = res.opt("data")
                  if (d is JSONArray) d = d.opt(0)
                  val url = if (d is JSONObject) d.getString("url") else d.toString()

                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 30000
                  conn.readTimeout = 120000
                  if (conn.responseCode !in 200..299) {
                      throw HttpException(conn.responseCode, "скачивание результата")
                  }
                  return conn.inputStream.use { it.readBytes() }
              }

              private fun http(method: String, url: String, key: String, body: String?): JSONObject {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.requestMethod = method
                  conn.connectTimeout = 30000
                  conn.readTimeout = 120000
                  conn.setRequestProperty("Authorization", "Bearer " + key)
                  if (body != null) {
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                  }
                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  if (code !in 200..299) {
                      throw HttpException(code, text.take(300))
                  }
                  return JSONObject(text)
              }

              private fun loadScaled(uri: Uri, maxSide: Int): ByteArray {
                  val bounds = BitmapFactory.Options()
                  bounds.inJustDecodeBounds = true
                  contentResolver.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, bounds) }
                  var sample = 1
                  while (maxOf(bounds.outWidth, bounds.outHeight) / sample > maxSide * 2) {
                      sample *= 2
                  }
                  val opts = BitmapFactory.Options()
                  opts.inSampleSize = sample
                  val bmp = contentResolver.openInputStream(uri)!!.use {
                      BitmapFactory.decodeStream(it, null, opts)
                  } ?: throw RuntimeException("не удалось прочитать фото")

                  var orientation = ExifInterface.ORIENTATION_NORMAL
                  try {
                      contentResolver.openInputStream(uri)!!.use {
                          orientation = ExifInterface(it).getAttributeInt(
                              ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL
                          )
                      }
                  } catch (e: Exception) {
                  }

                  val m = Matrix()
                  when (orientation) {
                      ExifInterface.ORIENTATION_ROTATE_90 -> m.postRotate(90f)
                      ExifInterface.ORIENTATION_ROTATE_180 -> m.postRotate(180f)
                      ExifInterface.ORIENTATION_ROTATE_270 -> m.postRotate(270f)
                      ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> m.postScale(-1f, 1f)
                      ExifInterface.ORIENTATION_FLIP_VERTICAL -> m.postScale(1f, -1f)
                      else -> {}
                  }
                  val longest = maxOf(bmp.width, bmp.height)
                  if (longest > maxSide) {
                      val f = maxSide.toFloat() / longest
                      m.postScale(f, f)
                  }
                  val out = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                  val bos = ByteArrayOutputStream()
                  out.compress(Bitmap.CompressFormat.JPEG, 92, bos)
                  return bos.toByteArray()
              }

              private fun save(name: String, bytes: ByteArray) {
                  val v = ContentValues()
                  v.put(MediaStore.Images.Media.DISPLAY_NAME, name)
                  v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                  v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Enhanced")
                  v.put(MediaStore.Images.Media.IS_PENDING, 1)
                  val out = contentResolver.insert(IMG, v)
                      ?: throw RuntimeException("не удалось создать файл")
                  contentResolver.openOutputStream(out)!!.use { it.write(bytes) }
                  v.clear()
                  v.put(MediaStore.Images.Media.IS_PENDING, 0)
                  contentResolver.update(out, v, null, null)
              }
          }
          EOF

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk PhotoEnhancer.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PhotoEnhancer.apk --repo "${{ github.repository }}" --title "Build ${{ github.run_number }}" --notes "Photo Enhancer APK"

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEnhancer
          path: PhotoEnhancer.apk
